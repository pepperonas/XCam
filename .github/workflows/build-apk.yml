name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

  build:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build optimized APK
      run: ./gradlew assembleReleaseDebug

    - name: Get version name
      id: version
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}')
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

    - name: Rename APKs
      env:
        VERSION_NAME: ${{ steps.version.outputs.version_name }}
      run: |
        cd app/build/outputs/apk/releaseDebug
        for apk in app-*.apk; do
          if [ -f "$apk" ]; then
            new_name=$(echo "$apk" | sed "s/app-/XCam-${VERSION_NAME}-/" | sed "s/-releaseDebug//")
            mv "$apk" "$new_name"
          fi
        done

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: XCam-APK
        path: app/build/outputs/apk/releaseDebug/XCam-*.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/releaseDebug/XCam-*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
