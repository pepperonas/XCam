name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate tag
        id: meta
        env:
          # Untrusted input is passed via env, never inlined into a run: script.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9A-Za-z._+-]+$'; then
            echo "Invalid tag format: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      # First, before any build: a release without notes must fail here, not publish an empty page.
      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -e
          {
            echo "## What's new"
            echo
            scripts/release-notes.sh "$TAG"
            echo
            echo "## Install"
            echo
            echo "One file: **xcam-${TAG}.apk** (64-bit ARM, Android 13 or newer)."
            echo
            echo "## Verify"
            echo
            echo 'Signing certificate SHA-256 (`apksigner verify --print-certs`):'
            echo
            echo '`78f163f0bfcff57e2e7d3212dee8aedb1d3bfdf48ce4c1512bf7801955a1cf38`'
            echo
            echo "File checksum: \`SHA256SUMS.txt\` below."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Tag matches versionName
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          VERSION=$(grep -E '^\s*versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          [ "v$VERSION" = "$TAG" ] || { echo "Tag $TAG does not match versionName $VERSION" >&2; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      # ABI splits produce exactly one APK (arm64-v8a); publish it under a stable, versioned name.
      - name: Name the APK and write its checksum
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -e
          SRC=$(ls app/build/outputs/apk/release/*.apk)
          [ "$(echo "$SRC" | wc -l)" -eq 1 ] || { echo "Expected one APK, got: $SRC" >&2; exit 1; }
          APK="xcam-${TAG}.apk"
          cp "$SRC" "$APK"
          sha256sum "$APK" > SHA256SUMS.txt
          ls -lh "$APK"; cat SHA256SUMS.txt

      # Every release must carry the same key, or it will not install over the previous one.
      - name: Verify the signing certificate
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -e
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "xcam-${TAG}.apk" | grep -i 'SHA-256' | awk '{print $NF}')
          EXPECTED=78f163f0bfcff57e2e7d3212dee8aedb1d3bfdf48ce4c1512bf7801955a1cf38
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "Signing certificate mismatch: $ACTUAL" >&2; exit 1; }
          echo "certificate ok: $ACTUAL"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: XCam ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            xcam-*.apk
            SHA256SUMS.txt

      - name: Clean up keystore
        if: always()
        run: rm -f release.jks
